name: observability

services:
  service:
    build: ../service
    image: portfolio-observability-service:local
    container_name: obs-service
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    networks: [observe]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: obs-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [observe]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: obs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks: [observe]

  alertmanager-config:
    image: python:3.13-alpine
    container_name: obs-alertmanager-config
    restart: "no"
    env_file:
      - path: ${RUNTIME_ENV_FILE:-.env}
        required: false
    volumes:
      - ./render_alertmanager.py:/render_alertmanager.py:ro
      - ./alertmanager.yml.tmpl:/alertmanager.yml.tmpl:ro
      - alertmanager-config:/rendered
    command: ["python", "/render_alertmanager.py", "/alertmanager.yml.tmpl", "/rendered/alertmanager.yml"]
    networks: [observe]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: obs-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager-config:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks: [observe]

  loki:
    image: grafana/loki:3.5.0
    container_name: obs-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [observe]

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: obs-alloy
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [observe]

  grafana:
    image: grafana/grafana:11.6.1
    container_name: obs-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    networks: [observe]

  k6:
    image: grafana/k6:0.57.0
    container_name: obs-k6
    profiles: [test]
    volumes:
      - ./k6.js:/scripts/k6.js:ro
    networks: [observe]

networks:
  observe:
    name: observability

volumes:
  prometheus-data:
  alertmanager-data:
  alertmanager-config:
  loki-data:
  alloy-data:
  grafana-data:
