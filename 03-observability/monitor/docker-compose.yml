name: observability-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: obs-monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-remote-write-receiver
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitor]

  loki:
    image: grafana/loki:3.5.0
    container_name: obs-monitoring-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "0.0.0.0:3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [monitor]

  grafana:
    image: grafana/grafana:11.6.1
    container_name: obs-grafana
    restart: unless-stopped
    env_file:
      - /etc/observability/monitoring.env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitor]

networks:
  monitor:

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
