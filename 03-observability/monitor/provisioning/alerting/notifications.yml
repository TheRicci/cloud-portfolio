apiVersion: 1

contactPoints:
  - orgId: 1
    name: monitoring-email
    receivers:
      - uid: monitoring-email
        type: email
        settings:
          addresses: $GRAFANA_ALERT_EMAIL

policies:
  - orgId: 1
    receiver: monitoring-email
    group_by: [alertname, severity]
    group_wait: 15s
    group_interval: 1m
    repeat_interval: 4h
