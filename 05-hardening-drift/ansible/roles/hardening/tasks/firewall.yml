---
- name: Allow SSH before the firewall is switched on
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Deny incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow outgoing traffic by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Switch the firewall on
  community.general.ufw:
    state: enabled
